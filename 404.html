<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ACLS v. NEH</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // Stores the requested path and redirects to index.html
      // The app's router then handles the route client-side
      sessionStorage.redirect = location.href;
      location.replace(
        location.pathname.split('/').slice(0, 2).join('/') + '/'
      );
    </script>
  </head>
  <body></body>
</html>
